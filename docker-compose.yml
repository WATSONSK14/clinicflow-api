services:
  db:
    image: postgres:16-alpine
    container_name: clinicflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clinicflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicflow_user} -d ${POSTGRES_DB:-clinicflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: clinicflow_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicflow_user}:${POSTGRES_PASSWORD:-clinicflow_pass}@db:5432/${POSTGRES_DB:-clinicflow_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

volumes:
  postgres_data: